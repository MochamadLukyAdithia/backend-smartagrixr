[variables]
NIXPACKS_PHP_VERSION = "8.3"
UPLOAD_MAX_FILESIZE = "150M"
POST_MAX_SIZE = "150M"

[phases.setup]
cmds = [
  # Buat file upload.ini
  'mkdir -p /etc/php/8.3/cli/conf.d/',
  'echo "upload_max_filesize=${UPLOAD_MAX_FILESIZE}" >> /etc/php/8.3/cli/conf.d/99-upload.ini',
  'echo "post_max_size=${POST_MAX_SIZE}" >> /etc/php/8.3/cli/conf.d/99-upload.ini',
  'echo "memory_limit=256M" >> /etc/php/8.3/cli/conf.d/99-upload.ini',
  'echo "max_execution_time=300" >> /etc/php/8.3/cli/conf.d/99-upload.ini',
  'echo "max_input_time=300" >> /etc/php/8.3/cli/conf.d/99-upload.ini',
  
  # Alternatif jika folder tidak ada
  'UPLOAD_INI_PATH=$(find /nix/store/*-php-*/lib -name php.ini -print0 | tail -z -n 1 | rev | cut -c 9- | rev)/upload.ini || true',
  'if [ -n "$UPLOAD_INI_PATH" ]; then echo "upload_max_filesize=${UPLOAD_MAX_FILESIZE}" >> $UPLOAD_INI_PATH; fi',
  'if [ -n "$UPLOAD_INI_PATH" ]; then echo "post_max_size=${POST_MAX_SIZE}" >> $UPLOAD_INI_PATH; fi',
  'if [ -n "$UPLOAD_INI_PATH" ]; then echo "memory_limit=256M" >> $UPLOAD_INI_PATH; fi',
]